  description: >-
    Standard Ethereum JSON-RPC 2.0 interface to the Bitfinity EVM mainnet
    (Chain ID 355110). Supports the standard eth_*, net_*, and web3_* method
    namespaces for reading chain state, submitting transactions, and deploying
    Solidity smart contracts. Public, no-auth endpoint compatible with MetaMask,
    ethers.js, web3.js, Hardhat, and Remix. Live client: evm_core/0.2.0.
