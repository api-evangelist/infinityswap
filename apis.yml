aid: infinityswap
name: InfinitySwap
description: >-
  InfinitySwap is now Bitfinity Network, a next-generation Ethereum Virtual
  Machine (EVM) that serves as a Layer 2 for Bitcoin and Bitcoin on-chain assets,
  built on the Internet Computer (ICP). Bitfinity delivers high-throughput
  (1000+ TPS) EVM execution with full Ethereum tooling compatibility (MetaMask,
  Remix, Hardhat) exposed through a standard Ethereum JSON-RPC endpoint, letting
  developers deploy Solidity smart contracts and bridge BTC, ckBTC, and other
  assets. The project also maintains the Bitfinity Wallet, the Bitfusion bridging
  SDK, canister SDKs for the Internet Computer, and the InfinitySwap decentralized
  exchange heritage. Backed by Polychain, it targets DeFi builders who want
  Bitcoin-secured, EVM-compatible infrastructure.
